# Test-only overrides: every test context gets a throwaway PostgreSQL started by
# Testcontainers (JDBC URL mode), and Hibernate builds the schema from the entities.
spring.datasource.url=jdbc:tc:postgresql:15-alpine:///promo_db
# Empty on purpose: Spring Boot then picks the Testcontainers JDBC driver from the jdbc:tc: URL
spring.datasource.driver-class-name=
spring.datasource.username=test
spring.datasource.password=test
spring.jpa.hibernate.ddl-auto=create-drop
