name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: Build and test (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # This service depends on promobridge-sdk 4.5, which is not published to a Maven repository,
      # so CI builds it from its release tag and installs it into the runner's local repository.
      - name: Install promobridge-sdk 4.5
        run: |
          git clone --depth 1 --branch 4.5 https://github.com/StefanBelc/promobridge-sdk.git "$RUNNER_TEMP/promobridge-sdk"
          mvn -B -q -f "$RUNNER_TEMP/promobridge-sdk/pom.xml" install -DskipTests

      # Unit tests plus Testcontainers integration tests (Docker is available on GitHub runners)
      - name: Build and run tests
        run: mvn -B verify
