name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # This service depends on promobridge-sdk 4.5, which is not published to a Maven repository,
      # so CI builds it from source and installs it into the runner's local repository.
      # Uses the 4.5 tag when present, otherwise the "release version 4.5" commit.
      - name: Install promobridge-sdk 4.5
        run: |
          git clone https://github.com/StefanBelc/promobridge-sdk.git "$RUNNER_TEMP/promobridge-sdk"
          git -C "$RUNNER_TEMP/promobridge-sdk" checkout -q 4.5 || git -C "$RUNNER_TEMP/promobridge-sdk" checkout -q 73e623c
          mvn -B -q -f "$RUNNER_TEMP/promobridge-sdk/pom.xml" install -DskipTests

      # Unit tests plus Testcontainers integration tests (Docker is available on GitHub runners)
      - name: Build and run tests
        run: mvn -B verify
